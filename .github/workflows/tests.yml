name: Test

on:
  push:
    branches:
      - f25
  pull_request:
    branches: 
      - f25
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup UV
        run: pip install uv

      - name: Install Python
        run: uv python install

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run tests
        run: uv run pytest

